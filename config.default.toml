# markerss default configuration — every option + default value.
# Copy to ~/.config/markerss/config.toml and edit, or keep this as reference.
# Read at startup; restart to apply. Unknown keys ignored; missing → defaults.

# ── storage / cleanup ──────────────────────────────────────────────────────
# SQLite database path. Relative paths resolve against ~/.config/markerss.
# Default: $XDG_CACHE_HOME/markerss/markerss.db
# db_path = "~/var/markerss.db"

# Purge stored content older than N days at startup.
# (Items flagged `saved` are exempt.)
# Default: 14
cache_ttl_days = 14

# Export base dir for `e` (markdown export).
# Default: $XDG_DATA_HOME/markerss
# export_dir = "/data/out"

# ── fetch ──────────────────────────────────────────────────────────────────
# Per-request timeout (seconds) for feeds and full-article fetch.
# Default: 30
fetch_timeout = 30

# Cap items kept per feed on refresh (newest kept). None = unlimited.
# max_items_per_feed = 50

# ── browser ────────────────────────────────────────────────────────────────
# Command used by `o` to open article URLs. None = xdg-open.
# browser = "firefox"

# ── refresh ────────────────────────────────────────────────────────────────
# Auto-refresh all feeds at startup.
# Default: true
refresh = true

# Periodic background refresh (minutes). None/0 = disabled.
# refresh = { interval_minutes = 30 }

# ── layout ─────────────────────────────────────────────────────────────────
# Three-pane widths (nav / list / article). Should sum to 1.0.
# Default: [0.15, 0.15, 0.7]
pane_ratio = [0.15, 0.15, 0.7]

# Nav pane presets — each is an array of sections; `t` cycles them.
# Valid: Unread, Read Later, Favourite, Categories, Tags, Saved, Feeds
# Default: one preset with all sections
nav_presets = [["Unread", "Read Later", "Favourite", "Categories", "Tags", "Saved"]]

# ── reading ────────────────────────────────────────────────────────────────
# Max article body width in columns. 0 = fill the pane.
# Default: 0
reading_width = 0

# ── theme ──────────────────────────────────────────────────────────────────
# Base color scheme. Light = light background / dark text; Dark = dark bg.
# Default: dark
background = "dark"

# Standalone theme file. One file can carry both modes via [light] / [dark].
# None = built-in palette (light_theme / dark defaults).
# Keys: background focused selected top accent dim h1 h2 h3 code quote link
# Colors: named or #rrggbb truecolor
# Relative names resolve against ~/.config/markerss.
# theme = "nord.toml"

# ── nav folding / sort ─────────────────────────────────────────────────────
# Initial fold depth of the Categories tree. None = all open.
# 0 = fold the whole Categories section to a single header row; N = levels 1..N open.
# foldlevel = 1

# Initial sort stack (max 3), applied left-to-right (first = highest priority).
# Valid: time title feed unread. Empty = no sort (date-desc default).
# sort = ["unread", "time"]

# ── keybindings ────────────────────────────────────────────────────────────
# Map of action → key string or list (combos like "gg", specials like "<enter>").
# A standalone keybindings.toml (same format) replaces this map when present.
# Actions: open back quit refresh refresh_all toggle_read toggle_read_next
# mark_list_read mark_all_read export browser favourite read_later saved new_feed delete
# rename edit_tags help focus_next focus_prev search jump_top jump_bottom
# next_unread prev_unread parent_next parent_prev copy_item_url copy_item_title
# copy_feed_url sort_time sort_title sort_feed sort_unread sort_*_rev
# cycle_preset import_opml export_opml
# keybindings = { "next_unread" = ["e"] }
